<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BetterHealth is offline</title>
  <style>
    :root { color-scheme: light; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; box-sizing: border-box;
      background: #f3f7f5; color: #0b1f1d; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    main { max-width: 26rem; background: #ffd23f; border-radius: 32px; padding: 32px; }
    h1 { margin: 0 0 12px; font-size: 2rem; line-height: 1.05; letter-spacing: -0.03em; }
    p { margin: 0 0 20px; font-size: 1.05rem; line-height: 1.5; }
    button { font: inherit; font-weight: 700; padding: 14px 24px; min-height: 48px; border-radius: 999px;
      border: 2px solid #0b1f1d; background: #ff5a1f; color: #0b1f1d; cursor: pointer; }
    button:focus-visible { outline: 3px solid #0b1f1d; outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <h1>You're offline.</h1>
    <p>BetterHealth needs a connection to load. Anything you already logged is safe on your device. Reconnect and try again.</p>
    <button onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
